version: '3.8'

services:
  php:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - DB_DRIVER=mysql
      - APP_DEBUG=true
    command: php -S 0.0.0.0:3000 -t public

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: machinjiri
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
